plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.120'
}

version = '2.0.0'
group = 'com.tlmjei'

base {
    archivesName = 'tlmjei'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'neoforge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {}
    server {}
}

repositories {
    mavenCentral()
    maven { url = "https://maven.blamejared.com/" }
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.234"
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.9.1.125"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.9.1.125"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.9.1.125"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title": "tlmjei",
            "Specification-Vendor": "tlmjei",
            "Specification-Version": "1",
            "Implementation-Title": "neoforge",
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": "tlmjei",
        ])
    }
}
