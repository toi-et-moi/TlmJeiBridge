plugins {
    id 'net.minecraftforge.gradle' version '[6.0.1,6.2]'
}

version = '1.0.0'
group = 'com.tlmjei'
archivesBaseName = 'tlmjei'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { tlmjei { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { tlmjei { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.blamejared.com/" }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'

    // JEI (compile + runtime)
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:15.20.0.104")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:15.20.0.104")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.20.0.104")
}

// IntelliJ IDEA expects this task for Gradle sync
tasks.register('idePostSync') {}

jar {
    manifest {
        attributes([
            "Specification-Title": "tlmjei",
            "Specification-Vendor": "tlmjei",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": "tlmjei",
        ])
    }
}
