pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        // Official CDN mirror of maven.neoforged.net. The primary domain is unreachable
        // from some networks (DNS resolves to unrelated IPs), which breaks the build.
        maven {
            url = 'https://neoforged.forgecdn.net/releases'
        }
    }
}

rootProject.name = 'TlmJeiBridge'
