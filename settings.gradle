pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven {
            url = 'https://maven.neoforged.net/releases'
            // Allow HTTP fallback for SSL issues
            allowInsecureProtocol = false
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'TlmJeiBridge'
